    <text x="879" y="307" fill="#26332F" font-family="Avenir Next, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">ONE CLEAR STEP</text>
    <path d="M1053 251L1070 268L1053 285" stroke="#77A496" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
